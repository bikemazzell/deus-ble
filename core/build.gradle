plugins { id 'java-library'; id 'maven-publish' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
dependencies { testImplementation 'junit:junit:4.12' }
publishing {
 publications { mavenJava(MavenPublication) { from components.java; artifactId = 'deus-ble-core' } }
 repositories { maven { name = 'localDevelopment'; url = rootProject.layout.buildDirectory.dir('maven') } }
}
