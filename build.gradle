plugins { id 'com.android.library' version '8.9.1' apply false }
allprojects { group = 'io.github.deusble'; version = '0.1.0-SNAPSHOT' }

subprojects {
    plugins.withId('maven-publish') {
        publishing.publications.withType(MavenPublication).configureEach {
            pom {
                name = project.name == 'core' ? 'deus-ble core' : 'deus-ble Android'
                description = 'Independent candidate advertisement parser and Android BLE scanner. Hardware support unverified.'
                licenses { license { name = 'Apache License, Version 2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0.txt' } }
            }
        }
    }
}
